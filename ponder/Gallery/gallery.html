<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <script src="gallery.js" defer></script>
</head>
<body>
        <h1>Gallery</h1>
    <section class="gallery">
        <figure>  
            <img src="images/images/book-sm.jpg" alt="Person Reading a Book">
        </figure>
        <figure>  
            <img src="images/images/couch-sm.jpg" alt="Person Sitting on a Couch with a Phone">
        </figure>
        <figure>  
            <img src="images/images/desk-sm.jpg" alt="A Work Desktop">
        </figure>
        <figure>  
            <img src="images/images/keyboard-sm.jpg" alt="Person Typing on a Keyboard">
        </figure>
        <figure>  
            <img src="images/images/phone-sm.jpg" alt="Person Looking at a Phone">
        </figure>
        <figure>  
            <img src="images/images/sit-sm.jpg" alt="Person Sitting on a Couch">
        </figure>
    </section>
    <dialog>
        <img>
        <button class="close-viewer">X</button>
        <div>
        <p>
        </div>
    </dialog>
</body>
</html>
