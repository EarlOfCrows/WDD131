<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="char-card.css">
</head>
<body>
    <div class="card">
        <div class="image">
            <img src="snortlebalt.webp" alt="Character Image">
        </div>
        <h2 class="name">Snortlebalt</h2>
        <div class="stats">
            <p>Level: 5</p>
            <p>HP: 100/100</p>
            <p>Attack: 50</p>
            <p>Defense: 40</p>
        </div>
        <div class="buttons">
            <button>Attack</button>
            <button>Defend</button>
        </div>
    </div>
</body>
</html>
