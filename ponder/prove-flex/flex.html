<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prove-Flex</title>
    <link rel="stylesheet" href="flex.css">
    <script src="flex.js" defer></script>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Prove-Flex">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    
</head>
<body>

    <div class="container">
        <header class="logo-container">
            <img src="images/recipe-book.png" alt="Recipe Book Logo" class="logo-img">
            <h1 class="logo-text">RECIPEBOOK</h1>
        </header>

        <div class="search-container">
            <input type="text" placeholder="Find a recipe" class="search-input">
            <button id="search-button">
                <img src="images/search.svg" alt="Search">
            </button>
        </div>

        <main class="recipe-card">
            <div class="recipe-image-container">
                <img src="images/apple-crisp.jpg" alt="Apple Crisp with Ice Cream" class="recipe-img">
            </div>
            
            <div class="recipe-details">
                <span class="tag">dessert</span>
                <h2 class="recipe-title">Apple Crisp</h2>
                
                <div class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </div>
                
                <p class="recipe-description">
                    This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </main>

        <footer>

            <div class="social">
                <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
                <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
                <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
            </div> 

            <div class="attribution">
                <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
            </div>                  

        </footer>
    </div>
                
</body>
</html>
