<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slay The Spire Filtered</title>
    <link rel="stylesheet" href="slayer_base.css">
    <script src="slayer_base.js" defer></script>
</head>
<body>
    <header>
        <h1>Slayer Base</h1>
        <img id="logo" src="images/logo.png" alt="Slayer Base Logo" class="logo">


    </header>
    <main>
    <section class="search-section">
        <!-- Text Search -->
        <div>
            <label for="searchInput">Search:</label>
            <input type="text" id="searchInput" name="searchInput" placeholder="Search Here...">
        </div>

        <!-- Description On/Off -->
        <div style="display: flex; align-items: center; padding-top: 25px;">
            <input type="checkbox" id="include_description" name="include_description">
            <label for="include_description" style="margin-bottom: 0;">Include Description</label>
        </div>

        <!-- Card/Relic -->
        <div>
            <label for="card/relic">Choose a Card/Relic:</label>
            <select id="card/relic" name="card/relic">
                <option value="Card">Card</option>
                <option value="Relic">Relic</option>
            </select>
        </div>

        <!-- Card Type -->
        <div>
            <label for="card_type">Choose a Card Type:</label>
            <select id="card_type" name="card_type">
                <option value="All">All</option>
                <option value="Attack">Attack</option>
                <option value="Skill">Skill</option>
                <option value="Power">Power</option>
                <option value="Curse">Curse</option>
            </select>
        </div>

        <!-- Rarity -->
        <div>
            <label for="rarity_search">Choose a rarity:</label>
            <select id="rarity_search" name="rarity_search">
                <option value="All">All</option>
                <option value="Common">Common</option>
                <option value="Uncommon">Uncommon</option>
                <option value="Rare">Rare</option>
                <option value="Ancient">Ancient</option> 
                <option value="Basic">Basic</option>  <!-- For cards -->
                <option value="Event">Event</option> <!-- For Both -->
                <option value="Shop">Shop</option> <!-- For Relics -->
                <option value="Starter">Starter</option> <!-- For Relics -->
            </select>
        </div>

        <!-- Character -->
        <div>
            <label for="character_search">Choose a character:</label>
            <select id="character_search" name="character_search">
                <option value="All">All</option>
                <option value="Ironclad">Ironclad</option>
                <option value="Silent">The Silent</option>
                <option value="Regent">The Regent</option>
                <option value="Defect">The Defect</option>
                <option value="Colorless">Colorless Only</option> <!-- For cards -->
            </select>
        </div>
    </section>

    <button id="searchButton">Search</button>

    <div>
            <label for="Order">Order by:</label>
            <select id="Order" name="Order">
                <option value="NAME">Name</option>
                <option value="RARITY">Rarity</option>
                <option value="CHARACTER">Character</option>
            </select>
        </div>

    <section class="results-section">
        <div id="resultsContainer"></div>
    </section>
</main>


    </main>
</body>
</html>
